# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindd = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindd = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindd = ,XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindd = ,XF86AudioMicMute, Mute microphone, exec, audio-input-mute
bindd = ,XF86MonBrightnessUp, Brightness up, exec, brightness-display +5%
bindd = ,XF86MonBrightnessDown, Brightness down, exec, brightness-display 5%-
bindd = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightness-display 100%
bindd = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightness-display 1%
bindd = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, brightness-keyboard up
bindd = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, brightness-keyboard down
bindd = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, brightness-keyboard cycle
bindd = ,XF86TouchpadToggle, Toggle touchpad, exec, toggle-touchpad
bindd = ,XF86TouchpadOn, Enable touchpad, exec, toggle-touchpad on
bindd = ,XF86TouchpadOff, Disable touchpad, exec, toggle-touchpad off

# Precise 1% multimedia adjustments with Alt modifier
bindd = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindd = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindd = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightness-display +1%
bindd = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightness-display 1%-

# Requires playerctl
bindd = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
bindd = , XF86AudioPause, Pause, exec, swayosd-client --playerctl play-pause
bindd = , XF86AudioPlay, Play, exec, swayosd-client --playerctl play-pause
bindd = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl previous

# Switch audio output with Super + Mute
bindd = SUPER, XF86AudioMute, Switch audio output, exec, audio-output-switch
